name: census-diff
# Executed harness = real coverage (catalog#2 condition): recompute both method
# readings from the frozen 2026-08-16 snapshot and fail unless the counts and
# the committed moved-row fixtures reproduce exactly.
on:
  push:
    paths: ["census/**", ".github/workflows/census-diff.yml"]
  pull_request:
    paths: ["census/**", ".github/workflows/census-diff.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require moved-row fixtures
        run: |
          test -f census/moved_out.jsonl || { echo "fixtures absent (sync deleted them?)"; exit 1; }
          test -f census/moved_in.jsonl || { echo "fixtures absent (sync deleted them?)"; exit 1; }
          test -f census/moved_claims_diff.py || { echo "fixtures absent (sync deleted them?)"; exit 1; }

      - name: Recompute census diff against frozen snapshot
        run: python census/moved_claims_diff.py --check
