[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-bp-calibrate-pypi"
version = "0.0.1"
description = "No-op MCP server for behavior-probe instrument calibration"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aos-bp-calibrate-pypi = "aos_bp_calibrate_pypi.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aos_bp_calibrate_pypi*"]
